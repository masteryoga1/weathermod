name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Game tests
        # The server exits with 0 when it fails before any test has run, so the line it logs once every
        # required test has passed is asked for as well.
        run: |
          ./gradlew runGameTestServer --no-daemon
          grep -q "required tests passed" run/logs/latest.log

      - uses: actions/upload-artifact@v4
        with:
          name: weathermod
          path: build/libs/*.jar
